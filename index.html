<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starlite — Locked</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      background: #fff; color: #000;
    }
    .gate {
      width: min(360px, 92vw); border: 2px solid #000; padding: 1.5rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.25rem; letter-spacing: -0.02em; text-transform: uppercase; }
    p { margin: 0 0 1rem; font-size: 0.8rem; line-height: 1.4; }
    label { display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.4rem; }
    input {
      width: 100%; padding: 0.65rem 0.75rem; border: 2px solid #000;
      font: inherit; font-size: 1rem; margin-bottom: 0.75rem;
    }
    button {
      width: 100%; padding: 0.7rem; border: 2px solid #000; background: #000; color: #fff;
      font: inherit; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
    }
    button:hover { background: #fff; color: #000; }
    .err { color: #000; font-size: 0.75rem; min-height: 1.2em; margin: 0 0 0.5rem; }
  </style>
</head>
<body>
  <form class="gate" id="gate" autocomplete="off">
    <h1>Starlite</h1>
    <p>This game is locked for now. Enter the password to play.</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" required autofocus />
    <p class="err" id="err" aria-live="polite"></p>
    <button type="submit">Unlock</button>
  </form>
  <script>
  (function () {
    var KEY = "arcade-unlock-starlite";
    var EXPECTED = "ab5ce89bbc9c62e5a1d3e6bbe0194316b62789497a3407e9aef2ecf92ef1ae91";
    function go() { location.replace("play.html"); }
    if (sessionStorage.getItem(KEY) === "1") { go(); return; }
    async function sha256(text) {
      var data = new TextEncoder().encode(text);
      var buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf)).map(function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    }
    document.getElementById("gate").addEventListener("submit", async function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      var val = document.getElementById("pw").value;
      err.textContent = "";
      try {
        var h = await sha256(val);
        if (h === EXPECTED) {
          sessionStorage.setItem(KEY, "1");
          go();
        } else {
          err.textContent = "Wrong password.";
          document.getElementById("pw").select();
        }
      } catch (ex) {
        err.textContent = "Could not check password.";
      }
    });
  })();
  </script>
</body>
</html>
